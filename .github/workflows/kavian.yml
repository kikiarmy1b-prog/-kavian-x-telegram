name: Inspect Kavian Posts

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Download Kavian X profile
        run: |
          curl -L \
            --max-time 30 \
            -A "Mozilla/5.0" \
            -o kavian.html \
            "https://x.com/KavianCoin"

      - name: Extract X post information
        run: |
          echo "=========================================="
          echo "KAVIAN X POST REFERENCES"
          echo "=========================================="

          strings kavian.html \
            | grep -oE 'https://x\.com/KavianCoin/status/[0-9]+' \
            | sort -u

          echo ""
          echo "=========================================="
          echo "TIMELINE DATA AROUND STATUS IDs"
          echo "=========================================="

          strings kavian.html \
            | grep -oE '.{0,150}KavianCoin/status/[0-9]+.{0,300}' \
            | head -20

          echo ""
          echo "=========================================="
          echo "TOTAL UNIQUE STATUS LINKS"
          echo "=========================================="

          strings kavian.html \
            | grep -oE 'KavianCoin/status/[0-9]+' \
            | sort -u \
            | wc -l
