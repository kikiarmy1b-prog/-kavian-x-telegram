name: Test Kavian Feed

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test RSSHub instance
        run: |
          URL="https://rsshub.isrss.com/twitter/user/KavianCoin"

          echo "Testing:"
          echo "$URL"
          echo ""

          curl -L \
            --max-time 30 \
            -A "Mozilla/5.0" \
            -o response.txt \
            -w "HTTP STATUS: %{http_code}\n" \
            "$URL"

          echo ""
          echo "========== RESPONSE =========="
          head -c 3000 response.txt
          echo ""
          echo "========== END RESPONSE =========="
