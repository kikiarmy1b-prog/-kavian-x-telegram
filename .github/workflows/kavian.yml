name: Test X Feed

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test x2rss connection
        run: |
          echo "Testing x2rss..."
          curl -L --max-time 30 -A "Mozilla/5.0" \
            -o feed.xml \
            -w "HTTP STATUS: %{http_code}\n" \
            "https://rss.gurify.com/KavianCoin/rss"

          echo "----- RESPONSE -----"
          head -c 2000 feed.xml
          echo
          echo "----- END -----"
