name: Inspect Kavian X Page

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Download Kavian X profile
        run: |
          curl -L \
            --max-time 30 \
            -A "Mozilla/5.0" \
            -o kavian.html \
            "https://x.com/KavianCoin"

      - name: Look for post data
        run: |
          echo "=== POST/TWEET DATA ==="

          grep -oE 'https://x\.com/KavianCoin/status/[0-9]+' kavian.html \
            | sort -u \
            | head -20

          echo ""
          echo "=== KAVIAN STATUS IDS ==="

          grep -oE 'KavianCoin/status/[0-9]+' kavian.html \
            | sort -u \
            | head -20

          echo ""
          echo "=== DATA COUNTS ==="

          echo "status links:"
          grep -oE 'KavianCoin/status/[0-9]+' kavian.html \
            | wc -l

          echo "bytes:"
          wc -c kavian.html
