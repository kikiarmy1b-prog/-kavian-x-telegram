name: Test Direct X Access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test X public profile
        run: |
          echo "Testing direct access to @KavianCoin..."
          echo ""

          curl -L \
            --max-time 30 \
            -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1" \
            -o kavian.html \
            -w "HTTP STATUS: %{http_code}\n" \
            "https://x.com/KavianCoin"

          echo ""
          echo "========== X RESPONSE =========="
          wc -c kavian.html
          head -c 2000 kavian.html
          echo ""
          echo "========== END =========="
